<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Best Deal Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbf3e4;
        --bg-soft: #f6ead3;
        --panel: #fffdf6;
        --panel-edge: #e8d9bd;
        --ink: #3b2c1c;
        --ink-soft: #7a6650;
        --accent: #b4500f;
        --accent-ink: #ffffff;
        --field-bg: #fffaf0;
        --field-edge: #d9c69e;
        --win-bg: #e7f3df;
        --win-edge: #7fae63;
        --win-ink: #2c5c22;
        --win-badge: #3f7d2e;
        --note-bg: #fdf0d3;
        --note-edge: #dfc084;
        --note-ink: #6d5316;
        --shadow: 0 2px 10px rgba(96, 64, 20, 0.10);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #241a11;
          --bg-soft: #2c2013;
          --panel: #31251a;
          --panel-edge: #4d3a26;
          --ink: #f4e9d7;
          --ink-soft: #c4ab8a;
          --accent: #e88a3a;
          --accent-ink: #2a1a0c;
          --field-bg: #241a11;
          --field-edge: #5d4630;
          --win-bg: #26381d;
          --win-edge: #6f9a55;
          --win-ink: #cdeab9;
          --win-badge: #7fb364;
          --note-bg: #3a2d12;
          --note-edge: #7d6530;
          --note-ink: #ecd9a0;
          --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
        }
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-variant-numeric: tabular-nums;
        line-height: 1.45;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px 16px 28px;
      }

      h1 {
        font-size: 1.7rem;
        font-weight: 900;
        letter-spacing: -0.01em;
        margin: 4px 0 6px;
      }
      .intro {
        margin: 0 0 18px;
        font-size: 1.02rem;
        color: var(--ink-soft);
        font-weight: 600;
      }

      .item {
        background: var(--panel);
        border: 2px solid var(--panel-edge);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: var(--shadow);
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      .item.winner {
        border-color: var(--win-edge);
        background: var(--win-bg);
      }
      .item-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      .item-name {
        font-size: 1.25rem;
        font-weight: 900;
        margin: 0;
      }
      .badge {
        display: none;
        background: var(--win-badge);
        color: #fff;
        font-weight: 800;
        font-size: 0.8rem;
        padding: 4px 10px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .item.winner .badge { display: inline-block; }
      @media (prefers-color-scheme: dark) {
        .badge { color: #16240f; }
      }

      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--ink-soft);
        margin: 0 0 5px 2px;
      }
      .row {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
      }
      .row:last-of-type { margin-bottom: 0; }
      .grow { flex: 1 1 0; min-width: 0; }
      .unit-wrap { flex: 0 0 118px; }

      input, select {
        width: 100%;
        min-height: 56px;
        font: inherit;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--ink);
        background: var(--field-bg);
        border: 2px solid var(--field-edge);
        border-radius: 12px;
        padding: 10px 12px;
        appearance: none;
        -webkit-appearance: none;
      }
      input:focus, select:focus {
        outline: none;
        border-color: var(--accent);
      }
      select {
        background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%),
                          linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
        background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%;
        background-size: 6px 6px, 6px 6px;
        background-repeat: no-repeat;
        padding-right: 34px;
        font-size: 1.05rem;
      }
      .price-wrap { position: relative; }
      .price-wrap span {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--ink-soft);
        pointer-events: none;
      }
      .price-wrap input { padding-left: 30px; }

      .unit-price {
        margin-top: 12px;
        min-height: 1.5em;
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--ink-soft);
      }
      .unit-price strong {
        color: var(--ink);
        font-size: 1.2rem;
        font-weight: 900;
      }
      .item.winner .unit-price strong { color: var(--win-ink); }

      .verdict {
        border-radius: 18px;
        padding: 18px 16px;
        margin-top: 4px;
        text-align: center;
        border: 2px dashed var(--panel-edge);
        background: var(--bg-soft);
      }
      .verdict.has-result {
        border: 2px solid var(--win-edge);
        background: var(--win-bg);
      }
      .verdict .big {
        font-size: 1.65rem;
        font-weight: 900;
        line-height: 1.2;
        margin: 0 0 6px;
      }
      .verdict.has-result .big { color: var(--win-ink); }
      .verdict .detail {
        font-size: 1.05rem;
        font-weight: 700;
        margin: 0;
      }
      .verdict .hint {
        font-size: 1rem;
        font-weight: 600;
        color: var(--ink-soft);
        margin: 0;
      }
      .verdict.note {
        border: 2px solid var(--note-edge);
        background: var(--note-bg);
      }
      .verdict.note .big { color: var(--note-ink); font-size: 1.3rem; }
      .verdict.note .detail { color: var(--note-ink); font-weight: 600; }

      .clear-row { text-align: center; margin-top: 16px; }
      .clear-btn {
        font: inherit;
        font-weight: 800;
        font-size: 0.95rem;
        color: var(--accent);
        background: none;
        border: 2px solid var(--panel-edge);
        border-radius: 999px;
        padding: 10px 22px;
        min-height: 48px;
        cursor: pointer;
      }
      .clear-btn:active { background: var(--bg-soft); }

      footer {
        margin-top: 26px;
        text-align: center;
        font-size: 0.85rem;
        color: var(--ink-soft);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Best Deal Calculator</h1>
      <p class="intro">Two sizes on the shelf? Enter both prices and sizes — see which one is truly cheaper per unit.</p>

      <section class="item" id="panelA" aria-label="Item A">
        <div class="item-head">
          <h2 class="item-name">Item A</h2>
          <span class="badge">Better deal</span>
        </div>
        <div class="row">
          <div class="grow">
            <label for="priceA">Price</label>
            <div class="price-wrap">
              <span aria-hidden="true">$</span>
              <input id="priceA" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off" />
            </div>
          </div>
        </div>
        <div class="row">
          <div class="grow">
            <label for="sizeA">Size / amount</label>
            <input id="sizeA" type="number" inputmode="decimal" min="0" step="any" placeholder="0" autocomplete="off" />
          </div>
          <div class="unit-wrap">
            <label for="unitA">Unit</label>
            <select id="unitA">
              <optgroup label="Weight">
                <option value="oz" selected>oz</option>
                <option value="lb">lb</option>
                <option value="g">g</option>
                <option value="kg">kg</option>
              </optgroup>
              <optgroup label="Volume">
                <option value="floz">fl oz</option>
                <option value="ml">ml</option>
                <option value="L">L</option>
              </optgroup>
              <optgroup label="Count">
                <option value="ct">count</option>
              </optgroup>
            </select>
          </div>
        </div>
        <p class="unit-price" id="unitPriceA" aria-live="polite"></p>
      </section>

      <section class="item" id="panelB" aria-label="Item B">
        <div class="item-head">
          <h2 class="item-name">Item B</h2>
          <span class="badge">Better deal</span>
        </div>
        <div class="row">
          <div class="grow">
            <label for="priceB">Price</label>
            <div class="price-wrap">
              <span aria-hidden="true">$</span>
              <input id="priceB" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off" />
            </div>
          </div>
        </div>
        <div class="row">
          <div class="grow">
            <label for="sizeB">Size / amount</label>
            <input id="sizeB" type="number" inputmode="decimal" min="0" step="any" placeholder="0" autocomplete="off" />
          </div>
          <div class="unit-wrap">
            <label for="unitB">Unit</label>
            <select id="unitB">
              <optgroup label="Weight">
                <option value="oz" selected>oz</option>
                <option value="lb">lb</option>
                <option value="g">g</option>
                <option value="kg">kg</option>
              </optgroup>
              <optgroup label="Volume">
                <option value="floz">fl oz</option>
                <option value="ml">ml</option>
                <option value="L">L</option>
              </optgroup>
              <optgroup label="Count">
                <option value="ct">count</option>
              </optgroup>
            </select>
          </div>
        </div>
        <p class="unit-price" id="unitPriceB" aria-live="polite"></p>
      </section>

      <section class="verdict" id="verdict" aria-live="polite">
        <p class="hint" id="verdictHint">Fill in both items and the better deal will appear here.</p>
        <p class="big" id="verdictBig" hidden></p>
        <p class="detail" id="verdictDetail" hidden></p>
      </section>

      <div class="clear-row">
        <button class="clear-btn" id="clearBtn" type="button">Clear both</button>
      </div>

      <footer>Made by Noki for Tyler. Public domain — share freely.</footer>
    </main>

    <script>
      // Unit table: factor converts 1 of the unit into the dimension's base unit.
      // Base units: grams (weight), milliliters (volume), each (count).
      var UNITS = {
        oz:   { dim: "weight", factor: 28.349523125, label: "oz" },
        lb:   { dim: "weight", factor: 453.59237,    label: "lb" },
        g:    { dim: "weight", factor: 1,            label: "g" },
        kg:   { dim: "weight", factor: 1000,         label: "kg" },
        floz: { dim: "volume", factor: 29.5735295625, label: "fl oz" },
        ml:   { dim: "volume", factor: 1,            label: "ml" },
        L:    { dim: "volume", factor: 1000,         label: "L" },
        ct:   { dim: "count",  factor: 1,            label: "each" }
      };
      // The common yardstick each dimension is normalized to.
      var NORMALIZED = {
        weight: { unit: "oz",   phrase: "per ounce" },
        volume: { unit: "floz", phrase: "per fl oz" },
        count:  { unit: "ct",   phrase: "per item" }
      };
      var DIM_NAMES = { weight: "weight", volume: "volume", count: "count" };

      function $(id) { return document.getElementById(id); }

      function fmtMoney(v) {
        if (!isFinite(v)) return "";
        if (v === 0) return "$0.00";
        if (v >= 10) return "$" + v.toFixed(2);
        if (v >= 1) return "$" + v.toFixed(2);
        if (v >= 0.1) return "$" + v.toFixed(3);
        return "$" + v.toFixed(4);
      }
      function fmtPct(v) {
        if (v >= 10) return Math.round(v) + "%";
        return (Math.round(v * 10) / 10) + "%";
      }
      // Small per-unit differences read better in cents than in $0.0206.
      function fmtDiff(v) {
        if (v >= 0.1) return fmtMoney(v);
        var cents = Math.round(v * 1000) / 10;
        return cents + "¢";
      }

      function readItem(prefix) {
        var priceRaw = $("price" + prefix).value.trim();
        var sizeRaw = $("size" + prefix).value.trim();
        var unitKey = $("unit" + prefix).value;
        var unit = UNITS[unitKey];
        var price = parseFloat(priceRaw);
        var size = parseFloat(sizeRaw);
        var complete = priceRaw !== "" && sizeRaw !== "" &&
                       isFinite(price) && isFinite(size) && price >= 0 && size > 0;
        var result = { complete: complete, unitKey: unitKey, unit: unit };
        if (complete) {
          result.perChosen = price / size; // dollars per 1 of the chosen unit
          result.perBase = price / (size * unit.factor); // dollars per base unit
          // dollars per 1 of the dimension's normalized unit
          result.perNorm = result.perBase * UNITS[NORMALIZED[unit.dim].unit].factor;
        }
        return result;
      }

      function renderItem(prefix, item) {
        var el = $("unitPrice" + prefix);
        if (!item.complete) { el.innerHTML = ""; return; }
        var norm = NORMALIZED[item.unit.dim];
        var html = "Unit price: <strong>" + fmtMoney(item.perChosen) + "</strong> per " + item.unit.label;
        if (item.unitKey !== NORMALIZED[item.unit.dim].unit) {
          html += " &nbsp;·&nbsp; " + fmtMoney(item.perNorm) + " " + norm.phrase;
        }
        el.innerHTML = html;
      }

      function update() {
        var a = readItem("A");
        var b = readItem("B");
        renderItem("A", a);
        renderItem("B", b);

        var panelA = $("panelA"), panelB = $("panelB");
        panelA.classList.remove("winner");
        panelB.classList.remove("winner");

        var verdict = $("verdict");
        var hint = $("verdictHint"), big = $("verdictBig"), detail = $("verdictDetail");
        verdict.classList.remove("has-result", "note");
        big.hidden = true; detail.hidden = true; hint.hidden = false;

        if (!a.complete || !b.complete) {
          hint.textContent = (a.complete || b.complete)
            ? "Now add the other item to see which is the better deal."
            : "Fill in both items and the better deal will appear here.";
          return;
        }

        if (a.unit.dim !== b.unit.dim) {
          verdict.classList.add("note");
          hint.hidden = true; big.hidden = false; detail.hidden = false;
          big.textContent = "These two don't measure the same way";
          detail.textContent = "Item A is priced by " + DIM_NAMES[a.unit.dim] +
            " and Item B by " + DIM_NAMES[b.unit.dim] +
            ", so they can't be compared fairly. Pick matching unit types — both weight, both volume, or both count — and the verdict will appear.";
          return;
        }

        var norm = NORMALIZED[a.unit.dim];
        hint.hidden = true; big.hidden = false; detail.hidden = false;

        var diff = Math.abs(a.perNorm - b.perNorm);
        if (diff < 1e-9 || diff / Math.max(a.perNorm, b.perNorm) < 0.0001) {
          big.textContent = "It's a tie!";
          detail.textContent = "Both cost " + fmtMoney(a.perNorm) + " " + norm.phrase + ". Pick either one.";
          return;
        }

        var aWins = a.perNorm < b.perNorm;
        var winner = aWins ? a : b;
        var loser = aWins ? b : a;
        var winnerName = aWins ? "Item A" : "Item B";
        (aWins ? panelA : panelB).classList.add("winner");
        verdict.classList.add("has-result");

        var perUnitLess = loser.perNorm - winner.perNorm;
        var pctLess = (perUnitLess / loser.perNorm) * 100;
        big.textContent = winnerName + " is the better deal";
        detail.textContent = fmtMoney(winner.perNorm) + " " + norm.phrase +
          " — that's " + fmtPct(pctLess) + " less than " + (aWins ? "Item B" : "Item A") +
          " (" + fmtDiff(perUnitLess) + " less " + norm.phrase + ").";
      }

      ["priceA", "sizeA", "unitA", "priceB", "sizeB", "unitB"].forEach(function (id) {
        $(id).addEventListener("input", update);
        $(id).addEventListener("change", update);
      });

      $("clearBtn").addEventListener("click", function () {
        ["priceA", "sizeA", "priceB", "sizeB"].forEach(function (id) { $(id).value = ""; });
        update();
        $("priceA").focus();
      });

      update();
    </script>
  </body>
</html>
