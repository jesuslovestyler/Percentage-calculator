<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Percentage Calculator</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbf4e8;
        --card: #fffdf8;
        --ink: #33241a;
        --ink-soft: #6f5b4c;
        --line: #e8d8c3;
        --accent: #b5501f;
        --accent-soft: #f7e3d3;
        --field-bg: #ffffff;
        --field-line: #d9c4a8;
        --up: #2e7d46;
        --up-bg: #e2f1e5;
        --down: #b03a2e;
        --down-bg: #f9e4e0;
        --shadow: 0 2px 10px rgba(120, 72, 30, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1d1611;
          --card: #2a2019;
          --ink: #f3e7d8;
          --ink-soft: #c2ab93;
          --line: #453627;
          --accent: #f0955f;
          --accent-soft: #453122;
          --field-bg: #241b14;
          --field-line: #57432f;
          --up: #7fd79b;
          --up-bg: #233d2a;
          --down: #f08d7e;
          --down-bg: #462723;
          --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
        }
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.45;
      }

      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px 16px 28px;
      }

      header { padding: 6px 2px 18px; }
      h1 {
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        font-size: 1.85rem;
        font-weight: 700;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      .intro {
        margin: 0;
        color: var(--ink-soft);
        font-size: 1.02rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 18px 16px 16px;
        margin-bottom: 16px;
      }
      .card-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
      }
      .step {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 700;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transform: translateY(5px);
      }
      .card h2 {
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        font-size: 1.28rem;
        font-weight: 700;
        margin: 0;
      }

      .fields {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        flex-wrap: wrap;
      }
      .field {
        flex: 1 1 0;
        min-width: 0;
      }
      .field label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--ink-soft);
        margin-bottom: 6px;
      }
      .input-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .suffix {
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--ink-soft);
        flex: 0 0 auto;
      }
      input[type="number"] {
        width: 100%;
        min-width: 0;
        min-height: 56px;
        padding: 10px 12px;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--ink);
        background: var(--field-bg);
        border: 1.5px solid var(--field-line);
        border-radius: 10px;
        -moz-appearance: textfield;
        appearance: textfield;
      }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      input[type="number"]::placeholder {
        color: var(--ink-soft);
        opacity: 0.45;
        font-weight: 400;
      }

      .answer-box {
        margin-top: 16px;
        padding: 14px 14px 12px;
        background: var(--accent-soft);
        border-radius: 10px;
      }
      .answer-label {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-bottom: 2px;
      }
      .answer {
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }
      .answer.idle { color: var(--ink-soft); font-weight: 500; font-size: 1.35rem; }
      .detail {
        margin-top: 4px;
        font-size: 0.95rem;
        color: var(--ink-soft);
        min-height: 1.3em;
      }
      .badge {
        display: inline-block;
        font-size: 0.85rem;
        font-weight: 700;
        padding: 3px 10px;
        border-radius: 999px;
        vertical-align: middle;
        margin-left: 8px;
      }
      .badge.up { background: var(--up-bg); color: var(--up); }
      .badge.down { background: var(--down-bg); color: var(--down); }
      .badge.flat { background: var(--accent-soft); color: var(--ink-soft); }

      footer {
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.88rem;
        padding: 8px 4px 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Percentage Calculator</h1>
        <p class="intro">Three everyday percentage questions, answered the moment you type.</p>
      </header>

      <!-- 1. What is X% of Y? -->
      <section class="card" aria-labelledby="h1calc">
        <div class="card-head">
          <span class="step" aria-hidden="true">1</span>
          <h2 id="h1calc">What is X% of Y?</h2>
        </div>
        <div class="fields">
          <div class="field">
            <label for="c1-percent">Percent</label>
            <div class="input-row">
              <input type="number" id="c1-percent" inputmode="decimal" placeholder="20" autocomplete="off" />
              <span class="suffix" aria-hidden="true">%</span>
            </div>
          </div>
          <div class="field">
            <label for="c1-of">of</label>
            <input type="number" id="c1-of" inputmode="decimal" placeholder="50" autocomplete="off" />
          </div>
        </div>
        <div class="answer-box">
          <div class="answer-label">Answer</div>
          <div class="answer idle" id="c1-answer">Type both numbers</div>
          <div class="detail" id="c1-detail"></div>
        </div>
      </section>

      <!-- 2. X is what % of Y? -->
      <section class="card" aria-labelledby="h2calc">
        <div class="card-head">
          <span class="step" aria-hidden="true">2</span>
          <h2 id="h2calc">X is what % of Y?</h2>
        </div>
        <div class="fields">
          <div class="field">
            <label for="c2-part">Part (X)</label>
            <input type="number" id="c2-part" inputmode="decimal" placeholder="15" autocomplete="off" />
          </div>
          <div class="field">
            <label for="c2-whole">Whole (Y)</label>
            <input type="number" id="c2-whole" inputmode="decimal" placeholder="60" autocomplete="off" />
          </div>
        </div>
        <div class="answer-box">
          <div class="answer-label">Answer</div>
          <div class="answer idle" id="c2-answer">Type both numbers</div>
          <div class="detail" id="c2-detail"></div>
        </div>
      </section>

      <!-- 3. Increase / decrease -->
      <section class="card" aria-labelledby="h3calc">
        <div class="card-head">
          <span class="step" aria-hidden="true">3</span>
          <h2 id="h3calc">Increase / decrease</h2>
        </div>
        <div class="fields">
          <div class="field">
            <label for="c3-from">From</label>
            <input type="number" id="c3-from" inputmode="decimal" placeholder="80" autocomplete="off" />
          </div>
          <div class="field">
            <label for="c3-to">To</label>
            <input type="number" id="c3-to" inputmode="decimal" placeholder="100" autocomplete="off" />
          </div>
        </div>
        <div class="answer-box">
          <div class="answer-label">Change</div>
          <div class="answer idle" id="c3-answer">Type both numbers</div>
          <div class="detail" id="c3-detail"></div>
        </div>
      </section>

      <footer>Made by Noki for Tyler. Public domain — share freely.</footer>
    </div>

    <script>
      (function () {
        "use strict";

        function num(el) {
          var v = parseFloat(el.value);
          return isFinite(v) ? v : null;
        }

        // Amounts: up to 2 decimals, thousands separators, useless zeros trimmed.
        function fmtAmount(n) {
          return n.toLocaleString("en-US", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
          });
        }

        // Percentages: up to 2 decimals, useless zeros trimmed.
        function fmtPct(n) {
          return n.toLocaleString("en-US", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
          });
        }

        function setAnswer(el, text, idle) {
          el.textContent = text;
          el.classList.toggle("idle", !!idle);
        }

        /* ---- Calculator 1: What is X% of Y? ---- */
        var c1p = document.getElementById("c1-percent");
        var c1y = document.getElementById("c1-of");
        var c1a = document.getElementById("c1-answer");
        var c1d = document.getElementById("c1-detail");

        function calc1() {
          var p = num(c1p), y = num(c1y);
          if (p === null || y === null) {
            setAnswer(c1a, "Type both numbers", true);
            c1d.textContent = "";
            return;
          }
          var result = (p / 100) * y;
          setAnswer(c1a, fmtAmount(result), false);
          c1d.textContent = fmtPct(p) + "% of " + fmtAmount(y) + " = " + fmtAmount(result);
        }

        /* ---- Calculator 2: X is what % of Y? ---- */
        var c2x = document.getElementById("c2-part");
        var c2y = document.getElementById("c2-whole");
        var c2a = document.getElementById("c2-answer");
        var c2d = document.getElementById("c2-detail");

        function calc2() {
          var x = num(c2x), y = num(c2y);
          if (x === null || y === null) {
            setAnswer(c2a, "Type both numbers", true);
            c2d.textContent = "";
            return;
          }
          if (y === 0) {
            setAnswer(c2a, "The whole can’t be 0", true);
            c2d.textContent = "A percentage of zero has no answer — try a different whole.";
            return;
          }
          var pct = (x / y) * 100;
          setAnswer(c2a, fmtPct(pct) + "%", false);
          c2d.textContent = fmtAmount(x) + " out of " + fmtAmount(y) + " is " + fmtPct(pct) + "%";
        }

        /* ---- Calculator 3: Increase / decrease ---- */
        var c3f = document.getElementById("c3-from");
        var c3t = document.getElementById("c3-to");
        var c3a = document.getElementById("c3-answer");
        var c3d = document.getElementById("c3-detail");

        function calc3() {
          var from = num(c3f), to = num(c3t);
          if (from === null || to === null) {
            setAnswer(c3a, "Type both numbers", true);
            c3d.textContent = "";
            return;
          }
          if (from === 0) {
            setAnswer(c3a, "The starting value can’t be 0", true);
            c3d.textContent = "Change from zero can’t be measured as a percentage.";
            return;
          }
          var diff = to - from;
          var pct = (diff / Math.abs(from)) * 100;
          var absPct = Math.abs(pct);

          c3a.classList.remove("idle");
          c3a.textContent = "";

          var main = document.createElement("span");
          var badge = document.createElement("span");
          badge.className = "badge";

          if (diff > 0) {
            main.textContent = "+" + fmtPct(absPct) + "%";
            badge.classList.add("up");
            badge.textContent = "Increase";
          } else if (diff < 0) {
            main.textContent = "−" + fmtPct(absPct) + "%";
            badge.classList.add("down");
            badge.textContent = "Decrease";
          } else {
            main.textContent = "0%";
            badge.classList.add("flat");
            badge.textContent = "No change";
          }
          c3a.appendChild(main);
          c3a.appendChild(badge);

          if (diff === 0) {
            c3d.textContent = fmtAmount(from) + " stayed the same.";
          } else {
            c3d.textContent =
              fmtAmount(from) + " → " + fmtAmount(to) +
              " is a change of " + (diff > 0 ? "+" : "−") + fmtAmount(Math.abs(diff)) + ".";
          }
        }

        [c1p, c1y].forEach(function (el) { el.addEventListener("input", calc1); });
        [c2x, c2y].forEach(function (el) { el.addEventListener("input", calc2); });
        [c3f, c3t].forEach(function (el) { el.addEventListener("input", calc3); });

        calc1(); calc2(); calc3();
      })();
    </script>
  </body>
</html>
